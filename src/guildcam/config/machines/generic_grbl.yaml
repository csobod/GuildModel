# GuildCAM machine profile — Generic GRBL (conservative template)
# A safe baseline for any GRBL 1.1 controller with reliable arc support. Clone
# this and edit the envelope/feeds/dynamics to match your machine.

name: generic_grbl
display_name: "Generic GRBL"

work_area_x_mm: 200.0
work_area_y_mm: 200.0
work_area_z_mm: 60.0

max_feed_mmpm: 2000.0
max_plunge_mmpm: 800.0
max_spindle_rpm: 24000.0
min_spindle_rpm: 0.0

max_doc_mm: 2.0

rapid_rate_mmpm: 3000.0
max_accel_mmps2: 300.0
junction_deviation_mm: 0.01

supports_arcs: true
units: mm
enforce_soft_limits: true
notes: "Conservative defaults — verify against your controller before cutting."

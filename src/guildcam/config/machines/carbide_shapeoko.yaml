# GuildCAM machine profile — Carbide 3D Shapeoko (Standard-size, belt-driven)
# Open-frame router; Carbide Motion board (GRBL 1.1, reliable G2/G3). Belt drive
# means lower effective rigidity than the Nomad — lighter DOC, lower accel.
# Work area varies widely by model (3 / 4 / Pro / 5 Pro); verify yours.

name: carbide_shapeoko
display_name: "Carbide 3D Shapeoko (Standard)"

# Representative Standard-size bed (~17.5 x 17.5 in); set to your model.
work_area_x_mm: 440.0
work_area_y_mm: 440.0
work_area_z_mm: 95.0

max_feed_mmpm: 5000.0
max_plunge_mmpm: 2000.0
max_spindle_rpm: 30000.0      # trim router (often ~10000 min)
min_spindle_rpm: 10000.0

# Belt-driven: keep depth-of-cut conservative.
max_doc_mm: 2.0

rapid_rate_mmpm: 5000.0
max_accel_mmps2: 300.0
junction_deviation_mm: 0.01

supports_arcs: true
units: mm
enforce_soft_limits: true
notes: >
  Work area and spindle vary by model (3/4/Pro/5 Pro). Trim routers idle high;
  min RPM 10000 reflects a typical Carbide Compact Router.

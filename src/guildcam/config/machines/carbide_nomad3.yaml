# GuildCAM machine profile — Carbide 3D Nomad 3
# Enclosed desktop mill, rigid cast-aluminium frame; Carbide Motion board
# (GRBL 1.1 derivative, reliable G2/G3). Many makers use these — verify the
# exact figures against your machine/spindle before cutting.

name: carbide_nomad3
display_name: "Carbide 3D Nomad 3"

# Work envelope: 8 x 8 x 3 inch.
work_area_x_mm: 203.0
work_area_y_mm: 203.0
work_area_z_mm: 76.0

max_feed_mmpm: 3000.0
max_plunge_mmpm: 1500.0
max_spindle_rpm: 24000.0
min_spindle_rpm: 0.0          # ER-11 spindle

# Rigid enough for acetate at the reference DOC; trim if running hard materials.
max_doc_mm: 4.0

rapid_rate_mmpm: 3000.0
max_accel_mmps2: 400.0
junction_deviation_mm: 0.01

supports_arcs: true
units: mm
enforce_soft_limits: true
notes: >
  8x8x3 in envelope. Confirm max feed/RPM for your spindle. The frame front
  (~110 mm wide) fits comfortably; larger frames may exceed the bed.

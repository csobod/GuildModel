# GuildModel tool table
# Geometry used by the drop-cutter (scipy morphology) structuring element.
# type: flat | ball | toroid
# all dimensions in mm
#
# Optional per-tool feeds/limits (BUILDPLAN M6.1, multi-tool jobs): a tool may
# carry feed_rate_mmpm / plunge_rate_mmpm / spindle_rpm / max_doc_mm. When set,
# they override the material preset for any op assigned that tool (a small tool
# wants gentler feeds than the bulk tool); when absent the material supplies
# them. All are clamped to the active machine profile at post time.

ball_1mm:
  display_name: "1 mm Ball Nose"
  type: ball
  diameter_mm: 1.0
  radius_mm: 0.5
  flutes: 2
  notes: "Lens groove and fine detail."

ball_2mm:
  display_name: "2 mm Ball Nose"
  type: ball
  diameter_mm: 2.0
  radius_mm: 1.0
  flutes: 2
  notes: "Relief finishing (scallop, nosepad)."

flat_3175:
  display_name: '3.175 mm (1/8") Flat End Mill, Single Flute'
  type: flat
  diameter_mm: 3.175
  radius_mm: 1.5875
  corner_radius_mm: 0.0
  flutes: 1
  notes: "The Demo Project reference tool — entire posterior cut, one tool."

engrave_vbit:
  display_name: "0.5 mm 30° Engraving V-bit"
  type: vbit
  diameter_mm: 0.5
  radius_mm: 0.25
  corner_radius_mm: 0.0
  included_angle_deg: 30.0      # groove width = 2·depth·tan(15°) (M7.9)
  flutes: 2
  flute_length_mm: 6.0
  feed_rate_mmpm: 300.0
  plunge_rate_mmpm: 100.0
  spindle_rpm: 14000
  max_doc_mm: 0.5
  notes: "Temple engraving — shallow text / logo grooves; a true V-bit (M7.9)."

flat_2mm:
  display_name: "2 mm Flat End Mill"
  type: flat
  diameter_mm: 2.0
  radius_mm: 1.0
  corner_radius_mm: 0.0
  flutes: 2
  feed_rate_mmpm: 500.0
  plunge_rate_mmpm: 200.0
  spindle_rpm: 12000
  max_doc_mm: 1.5
  notes: "Hinge pockets and tight internal radii (multi-tool jobs, M6.1)."

drill_m4_clear:
  display_name: "4.5 mm Drill (M4 clearance)"
  type: flat
  diameter_mm: 4.5
  radius_mm: 2.25
  corner_radius_mm: 0.0
  flutes: 2
  feed_rate_mmpm: 150.0
  plunge_rate_mmpm: 80.0
  spindle_rpm: 6000
  max_doc_mm: 2.0
  notes: "M4 clearance drilling for base-curve block mounting holes (M6.4)."

flat_3mm:
  display_name: "3 mm Flat End Mill"
  type: flat
  diameter_mm: 3.0
  radius_mm: 1.5
  corner_radius_mm: 0.0
  flutes: 2
  notes: "Profile cut and hinge pockets."

flat_6mm:
  display_name: "6 mm Flat End Mill"
  type: flat
  diameter_mm: 6.0
  radius_mm: 3.0
  corner_radius_mm: 0.0
  flutes: 2
  notes: "Roughing / stock removal (optional)."

# GuildModel material presets (shipped defaults).
# All feeds in mm/min, speeds in RPM, depths in mm.
# These are conservative starting defaults — adjust per actual machine and stock.
#
# spindle_rpm / feed_rate_mmpm / plunge_rate_mmpm / relief_stepover_mm /
# contour_stepdown_mm / rough_axial_stock_mm are the CAM defaults loaded into the
# CAM tab when a material is selected. User edits can be written back as
# overrides in ~/.guildmodel/materials.yaml (this file stays the shipped baseline,
# restorable from Preferences ▸ Materials ▸ Reset to shipped).

acetate:
  display_name: "Acetate"
  notes: "Standard cellulose acetate sheet. Demo Project reference feeds (proven on the Guild CNC program)."
  spindle_rpm: 10000
  feed_rate_mmpm: 750
  plunge_rate_mmpm: 333
  max_doc_mm: 2.5       # maximum depth-of-cut per pass (reference contour stepdown)
  relief_stepover_mm: 0.9       # matches the Fusion Scallop coverage
  contour_stepdown_mm: 2.5
  rough_axial_stock_mm: 2.0
  chip_load_min_mm: 0.02        # feed-per-tooth window (M7.10); below = rubbing
  chip_load_max_mm: 0.15        # above = overloaded
  recommended_tools:
    relief: flat_3175
    profile: flat_3175
    groove: ball_1mm

acetal:
  display_name: "Acetal (POM)"
  notes: "White Delrin / acetal — base-curve forming blocks (M6.4). Machines clean and rigid; tougher than acetate, so a touch slower."
  spindle_rpm: 12000
  feed_rate_mmpm: 600
  plunge_rate_mmpm: 200
  max_doc_mm: 2.0
  relief_stepover_mm: 0.9
  contour_stepdown_mm: 2.0
  rough_axial_stock_mm: 1.5
  chip_load_min_mm: 0.03        # tougher than acetate — a slightly thicker chip
  chip_load_max_mm: 0.18
  recommended_tools:
    relief: flat_3175
    profile: flat_3175
    groove: ball_1mm

horn:
  display_name: "Horn"
  notes: "Natural horn. Brittle and variable — use conservative settings. Inspect each blank."
  spindle_rpm: 12000
  feed_rate_mmpm: 400
  plunge_rate_mmpm: 100
  max_doc_mm: 0.8
  relief_stepover_mm: 0.6       # finer + shallower: horn is brittle
  contour_stepdown_mm: 0.8
  rough_axial_stock_mm: 1.0
  chip_load_min_mm: 0.01        # brittle — keep the chip thin
  chip_load_max_mm: 0.08
  recommended_tools:
    relief: ball_2mm
    profile: flat_3mm
    groove: ball_1mm

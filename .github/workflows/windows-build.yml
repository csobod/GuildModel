# Builds the Windows artifacts on GitHub's Windows runners — no Windows box
# needed. Trigger it manually (Actions tab > "Windows build" > Run workflow),
# then download the artifact and attach its contents to the GitHub release.
#
# Produces both distribution artifacts:
#   - GuildModel-<version>-win64.zip    portable one-folder build (unzip + run)
#   - GuildModel-<version>-setup.exe    per-user Inno Setup installer
#
# This runs scripts/build_release.ps1 unchanged — the same script a maker runs
# locally — so the CI build and a hand build cannot drift apart. Inno Setup is
# not on the runner image, so it is installed via Chocolatey into the default
# location the script already probes.
#
# GuildModel renders 3D through PyVista/VTK, so the freeze bundles the VTK DLLs
# and is large and slow — hence the generous timeouts below, matching macOS.
#
# NOT code-signed: Windows SmartScreen will warn on first run of the installer
# ("More info" > "Run anyway"). Signing needs a certificate that cannot live in
# a public repo.
name: Windows build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # VTK freeze + Inno is heavy, and Compress-Archive over a ~500 MB one-folder
    # build is single-threaded and slow — a wider budget than macOS. Caps a
    # runaway job; a healthy run finishes well inside it.
    #
    # Raised from 60 for v1.5.0: the gate below is most of this budget now. The
    # suite was ~576 tests when these numbers were written and is 1085, with the
    # B-Rep parity work — which `dev` pulls in via `guildmodel[brep]` — the slow
    # part. It runs 60 minutes on a 20-core desktop, so 60 for the whole job
    # could not have produced an artifact.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e ".[dev,packaging]"
          .venv\Scripts\python.exe -m pip install pytest-timeout   # CI-only: per-test hang guard

      # The gate, minus the tests that build a real MainWindow. offscreen keeps
      # Qt off the window station; the thread timeout method turns any
      # native-event-loop hang into a stack dump naming the test (the default
      # signal method cannot interrupt one).
      #
      # **Why `-m "not gui"` rather than the whole suite.** On this runner and on
      # macos-15-intel, one window test parks the main thread indefinitely — the
      # same frame on two unrelated platforms, which is the signature of a GIL
      # holder rather than a slow test. It does not reproduce on Linux or on
      # macos-14. `--timeout-method=thread` cannot interrupt that politely, so it
      # kills the interpreter: one stuck test ends the run and the build produces
      # no artifact. That cost 80 minutes here and 79 on macOS across v1.5.0's
      # first two attempts, before anyone knew which test to look at.
      #
      # It is quarantined, not fixed. The `gui` mark is what makes the quarantine
      # possible and tests/test_gui_marker.py is what keeps it honest — it fails
      # if a new MainWindow test forgets the mark and lands back in here.
      #
      # 90, not 25: measured at 1085 tests / 60 minutes on a 20-core desktop
      # (v1.5.0). A runner is slower, and a gate that trips is indistinguishable
      # from a red suite at the point it matters most — cutting a release.
      - name: Test gate
        timeout-minutes: 90
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python.exe -m pytest tests -q -m "not gui" --timeout=300 --timeout-method=thread

      # Not on the runner image. Chocolatey drops ISCC.exe in
      # "C:\Program Files (x86)\Inno Setup 6\", which build_release.ps1 probes.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build (zip + installer)
        shell: pwsh
        env:
          GUILDMODEL_SKIP_TESTS: "1"          # the Test gate step above already ran
          GUILDMODEL_REQUIRE_INSTALLER: "1"   # a missing ISCC is a failure, not a warning
        run: .\scripts\build_release.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GuildModel-windows-x64
          path: |
            dist/GuildModel-*-win64.zip
            dist/GuildModel-*-setup.exe
          if-no-files-found: error

      # Dead last, on purpose. These are the tests known to hang on this runner,
      # and `continue-on-error` only stops a hang from failing the job — it does
      # not stop it from spending 20 minutes. Run before the build, that is 20
      # minutes taken out of a budget the heavy step still needs (macOS: 140
      # total, 90 of it already the gate). Run after the upload, the artifact is
      # already safe and the worst a hang can do is make the run look slow.
      - name: Window tests (reported, non-blocking)
        timeout-minutes: 20
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python.exe -m pytest tests -q -m gui --timeout=300 --timeout-method=thread

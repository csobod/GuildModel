# Builds the macOS artifacts on GitHub's macOS runners — no local Mac needed.
# Trigger it manually (Actions tab > "macOS build" > Run workflow), then
# download the artifacts and attach them to the GitHub release.
#
# One artifact per architecture (PyInstaller does not cross-compile):
#   - macos-14 runner        -> arm64  (Apple Silicon)
#   - macos-15-intel runner  -> x86_64 (Intel; best-effort — GitHub is winding
#     Intel runners down, so this leg may need a new label or can be dropped
#     when it stops working)
#
# GuildModel renders 3D through PyVista/VTK, so the freeze bundles the VTK
# dylibs and is large (~500 MB) and slower than a 2D app — hence the generous
# timeouts below.
name: macOS build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            required: true
          - runner: macos-15-intel
            arch: x86_64
            required: false
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    # Raised from 50 for v1.5.0 — see the Windows workflow for the measurement;
    # the test gate below is now most of the budget.
    timeout-minutes: 180            # VTK freeze + dmg is heavy; never burn hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The release notes promise macOS 13, Qt 6.11's floor. numpy and scipy
      # publish a macOS 14 build on Accelerate beside one for older macOS on
      # OpenBLAS, and pip on a runner at 14 or later takes the newer; the 2.0
      # bundles first came out needing macOS 14 that way. The older wheels go
      # in first, so the editable install finds numpy and scipy satisfied, and
      # the kernel is compiled for 13.
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip download --only-binary=:all: --no-deps --platform macosx_13_0_${{ matrix.arch }} numpy scipy -d wheels-macos13
          .venv/bin/pip install wheels-macos13/*.whl
          .venv/bin/pip install -e ".[dev,packaging]"
          .venv/bin/pip install pytest-timeout   # CI-only: per-test hang guard
          MACOSX_DEPLOYMENT_TARGET=13.0 .venv/bin/pip install ./ext   # the stock engine's C++ kernel (BUILDPLAN M21 §6.3)

      # A wheel whose every macOS tag is newer than 13 cannot be in the bundle.
      - name: Every wheel installs on macOS 13
        run: |
          .venv/bin/python - <<'EOF'
          import importlib.metadata as md, re, sys
          late = []
          for dist in md.distributions():
              tags = [ln.split(":", 1)[1].strip() for ln in (dist.read_text("WHEEL") or "").splitlines()
                      if ln.startswith("Tag:")]
              macs = [int(m.group(1)) for t in tags if (m := re.search(r"macosx_(\d+)_", t))]
              if macs and min(macs) > 13:
                  late.append(f"{dist.metadata['Name']} {dist.version}: {', '.join(tags)}")
          print("\n".join(late) or "every wheel installs on macOS 13")
          sys.exit(1 if late else 0)
          EOF

      # The gate, minus the tests that build a real MainWindow. offscreen keeps
      # Qt off the window server; the thread timeout method turns any
      # native-event-loop hang into a stack dump naming the test (the default
      # signal method cannot interrupt one).
      #
      # `-m "not gui"` for the reason the Windows workflow spells out: on
      # macos-15-intel one window test parks the main thread and the thread
      # timeout method then kills the interpreter, so a single hang ends the run
      # and no artifact is produced. macos-14 runs them green, which is why this
      # is a quarantine and not a fix. 90, not 25 — see the Windows note.
      #
      # 110 for v1.8.0: the v1.7.0 Intel gate ran 76 of its 90 minutes
      # (macos-14: 29), and M18 plus the hinge pocket angle added 110
      # non-gui tests, about a tenth of the suite. A gate that trips on the
      # optional leg leaves the workflow green with no x86_64 artifact.
      #
      # 130 for v2.0.0: the Intel gate ran 89 of its 110 minutes (macos-14:
      # 33) with 1,726 tests, up from 1,350 at v1.8.1.
      - name: Test gate
        timeout-minutes: 130
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m pytest tests -q -m "not gui" --timeout=300 --timeout-method=thread

      - name: Build (.app + zip + dmg)
        env:
          GUILDMODEL_SKIP_SMOKE: "1"   # no window session for a launch check
          GUILDMODEL_SKIP_TESTS: "1"   # the Test gate step above already ran
        run: bash scripts/build_release_macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GuildModel-macos-${{ matrix.arch }}
          path: |
            dist/GuildModel-*-macos-*.zip
            dist/GuildModel-*-macos-*.dmg
          if-no-files-found: error

      # Dead last, on purpose. These are the tests known to hang on this runner,
      # and `continue-on-error` only stops a hang from failing the job — it does
      # not stop it from spending 20 minutes. Run before the build, that is 20
      # minutes taken out of a budget the heavy step still needs (macOS: 140
      # total, 90 of it already the gate). Run after the upload, the artifact is
      # already safe and the worst a hang can do is make the run look slow.
      - name: Window tests (reported, non-blocking)
        timeout-minutes: 20
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m pytest tests -q -m gui --timeout=300 --timeout-method=thread

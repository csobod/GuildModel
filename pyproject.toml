[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guildmodel"
version = "1.1.0"
description = "Free, open-source CAM tool for spectacle frame cutting on GRBL CNC machines"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "numpy>=1.26",
    "scipy>=1.13",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "ezdxf>=1.3",
    "svgelements>=1.9",
    "trimesh>=4.4",
    "rtree>=1.2",       # trimesh's bounds-tree backend (the STL-gate test needs it)
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
packaging = [
    "pyinstaller>=6.6",
]

[project.scripts]
# boot, not app: the splash must show before the heavy VTK import (gui/boot.py)
guildmodel = "guildmodel.gui.boot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guildmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/guildmodel/core"]
omit = ["src/guildmodel/gui/*"]

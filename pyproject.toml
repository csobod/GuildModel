[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guildmodel"
# Display/tag version is 1.0.0-rc1a ("-rc1a" is not PEP 440-valid); rc1.post1
# orders rc1 < rc1a < rc2 for pip. RC1b maps to .post2.
version = "1.0.0rc1.post1"
description = "Free, open-source CAM tool for spectacle frame cutting on GRBL CNC machines"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "numpy>=1.26",
    "scipy>=1.13",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "ezdxf>=1.3",
    "svgelements>=1.9",
    "trimesh>=4.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
packaging = [
    "pyinstaller>=6.6",
]

[project.scripts]
guildmodel = "guildmodel.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guildmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/guildmodel/core"]
omit = ["src/guildmodel/gui/*"]

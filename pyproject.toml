[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guildmodel"
version = "1.5.0"
description = "Free, open-source CAM tool for spectacle frame cutting on GRBL CNC machines"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "numpy>=1.26",
    "scipy>=1.13",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "ezdxf>=1.3",
    "trimesh>=4.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Mesh-domain CSG (BUILDPLAN-NEW M-N1), and since M-N4 the only geometry
    # kernel a normal install carries. Apache-2.0, a few MB against OCCT's 264,
    # and the guarantee that matters is structural: a Manifold is closed and
    # manifold by construction, so the failure class this project spent a
    # season chasing cannot be represented. Floated, not pinned: unlike the
    # B-Rep kernel it produces meshes we verify directly on every build.
    "manifold3d>=3.5",
]

[project.optional-dependencies]
# B-Rep solid kernel (OCCT 7.9) — **optional as of BUILDPLAN-NEW M-N4**.
#
# 264 MB installed (163 MB of `OCP` plus 101 MB of `cadquery_ocp.libs`), for a
# kernel that is no longer the default, no longer posts G-code, and is no
# longer needed by any feature — every posterior feature loads zero OCP modules
# on the mesh path since the rim lip got a native curve evaluator.
#
# Demoted rather than deleted: it is the third opinion every parity gate
# measures the mesh against, and building the same part two ways is what has
# caught this season's silent defects. `dev` therefore includes it, and
# `core.kernels` keeps it out of Preferences unless `GUILDMODEL_BREP` is set.
#
# Pinned exactly, not floated: the rebuilt geometry must be reproducible across
# versions or a saved project previews differently after a dependency bump
# (BREP-REWRITE-REPORT.md §5.4). LGPL-2.1 + OCCT Exception — see NOTICE for the
# relinking obligation.
brep = [
    "cadquery-ocp==7.9.3.1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "guildmodel[brep]",           # the parity gates need the third opinion
    # trimesh's spatial-index backend. It was a *runtime* dependency carrying a
    # comment saying a test needed it — and nothing in `src/` imports it, or
    # ever did. The one consumer is `test_castle_m2`'s STL ray cast, which is
    # trimesh reaching for it implicitly, so it belongs here.
    "rtree>=1.2",
]
packaging = [
    "pyinstaller>=6.6",
]

[project.scripts]
# boot, not app: the splash must show before the heavy VTK import (gui/boot.py)
guildmodel = "guildmodel.gui.boot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guildmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/guildmodel/core"]
omit = ["src/guildmodel/gui/*"]
